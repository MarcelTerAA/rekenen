<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rekenen – Software developer | lesintro's digibord</title>
<style>
  :root{--bg:#0e1626;--panel:#16223a;--line:#2c3f63;--ink:#eef3fb;--muted:#9fb0cc;--accent:#3ee0b0;--accent2:#ffcf4a;
    --mono:ui-monospace,"Cascadia Code","Consolas",monospace;--sans:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:var(--sans);
    background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:40px 40px}
  main{max-width:1100px;margin:0 auto;padding:40px 32px 64px}
  nav{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:40px}
  nav a{font-family:var(--mono);font-size:14px;color:var(--muted);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:6px 14px}
  nav a:hover{border-color:var(--accent);color:var(--ink)}
  nav a.on{background:var(--accent);border-color:var(--accent);color:#06121f;font-weight:700}
  nav .home{margin-right:auto}
  .kicker{font-family:var(--mono);color:var(--accent);letter-spacing:2px;text-transform:uppercase;font-size:15px}
  h1{font-size:56px;margin:8px 0 6px;line-height:1.1}
  p.lead{color:var(--muted);font-size:20px;margin:0}
  .noot{margin-top:16px;display:inline-block;background:rgba(255,207,74,.1);border:1px solid rgba(255,207,74,.35);color:var(--accent2);border-radius:12px;padding:10px 16px;font-size:16px}
  h2{font-size:15px;font-family:var(--mono);color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;margin:44px 0 14px;font-weight:400}
  .week{display:grid;grid-template-columns:110px 1fr;gap:16px;align-items:stretch;margin-bottom:16px}
  .wk{font-family:var(--mono);color:var(--accent);font-size:14px;text-transform:uppercase;letter-spacing:1.5px;padding-top:24px}
  .wk b{display:block;font-size:40px;color:var(--ink);letter-spacing:0;line-height:1.1}
  .lessen{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
  a.card{display:block;text-decoration:none;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px 24px;transition:border-color .2s,transform .2s;position:relative}
  a.card:hover{border-color:var(--accent);transform:translateY(-2px)}
  a.card::after{content:"start →";position:absolute;right:22px;top:24px;font-family:var(--mono);font-size:14px;color:var(--accent)}
  .t{font-size:26px;font-weight:700;margin:0 70px 6px 0}
  .s{color:var(--muted);font-size:16px}
  .en{margin-top:8px;font-family:var(--mono);font-size:14px;color:var(--accent2)}
  .en::before{content:"EN · "}
  footer{margin-top:56px;color:var(--muted);font-size:14px}
  @media (max-width:640px){ h1{font-size:40px} .week{grid-template-columns:1fr} .wk{padding-top:0} .wk b{display:inline;font-size:inherit;color:var(--accent)} }
</style>
</head>
<body>
<main>
  <nav id="nav"></nav>
  <div class="kicker" id="kicker"></div>
  <h1 id="naam"></h1>
  <p class="lead" id="lead"></p>
  <div id="noot"></div>
  <div id="lijst"></div>
  <footer>Te gebruiken naast ffRekenen. Bediening op het digibord: pijltjestoetsen of klikken, <b>F</b> volledig scherm, <b>T</b> timer, <b>Home</b> terug naar dit overzicht.</footer>
</main>
<script src="../onderwerpen.js"></script>
<script>
const CODE = "sd";
const O = OPLEIDINGEN[CODE];
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

document.getElementById("nav").innerHTML =
  `<a class="home" href="../">← alle opleidingen</a>` +
  Object.entries(OPLEIDINGEN).map(([k,o]) => `<a href="../${k}/"${k===CODE?' class="on"':''}>${k.toUpperCase()} · niv. ${o.niveau}</a>`).join("");
document.getElementById("kicker").textContent = `Rekenen · niveau ${O.niveau} · ${O.ref}`;
document.getElementById("naam").textContent = O.naam;
document.getElementById("lead").textContent = `${O.crebo} · ${O.klas} — kies het onderwerp om de lesintro te starten.`;
if (O.noot) document.getElementById("noot").innerHTML = `<div class="noot">${esc(O.noot)}</div>`;

let html = "", periode = null;
ONDERWERPEN.forEach(ond => {
  const lessen = (ond.lessen || {})[CODE];
  if (!lessen || !lessen.length) return;
  if (ond.periode !== periode) { periode = ond.periode; html += `<h2>${esc(periode)}</h2>`; }
  html += `<div class="week"><div class="wk">week<b>${esc(ond.week)}</b></div><div class="lessen">` +
    lessen.map(l => `<a class="card" href="../${ond.map}/?o=${CODE}#${l.hash}">
        <div class="t">${esc(l.titel)}</div>
        <div class="s">${esc(l.sub || "")}</div>
        ${l.en ? `<div class="en">${esc(l.en)}</div>` : ""}
      </a>`).join("") +
    `</div></div>`;
});
document.getElementById("lijst").innerHTML = html || `<h2>Nog geen lesintro's</h2>`;
</script>
</body>
</html>
