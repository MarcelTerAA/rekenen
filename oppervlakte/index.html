<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rekenen – Oppervlakte | Lesintro digibord</title>
<style>
  :root{
    --bg:#0e1626; --panel:#16223a; --panel2:#1d2c4a; --line:#2c3f63;
    --ink:#eef3fb; --muted:#9fb0cc; --accent:#3ee0b0; --accent2:#ffcf4a;
    --warn:#ff6b6b; --blue:#5aa9ff;
    --mono: ui-monospace, "Cascadia Code", "Consolas", "SFMono-Regular", monospace;
    --sans: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#070c16;color:var(--ink);font-family:var(--sans);overflow:hidden}
  #viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  #stage{width:1600px;height:900px;position:relative;background:var(--bg);transform-origin:center center;
    background-image:radial-gradient(circle at 85% 10%, rgba(62,224,176,.08), transparent 40%),
    linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
    background-size:auto,40px 40px,40px 40px;overflow:hidden}

  /* top bar */
  #top{position:absolute;left:0;right:0;top:0;height:76px;display:flex;align-items:center;gap:18px;padding:0 40px;border-bottom:1px solid var(--line)}
  #classTag{white-space:nowrap;font-family:var(--mono);font-size:18px;color:var(--accent);background:rgba(62,224,176,.1);border:1px solid rgba(62,224,176,.35);padding:6px 12px;border-radius:8px;cursor:pointer}
  #steps{display:flex;gap:6px;margin-left:auto}
  .stp{font-size:16px;color:var(--muted);padding:7px 14px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
  .stp.on{color:#06121f;background:var(--accent);border-color:var(--accent);font-weight:700}
  .stp.done{color:var(--ink);border-color:#3b5482}

  #content{position:absolute;left:0;right:0;top:76px;bottom:64px;padding:28px 60px}
  #bottom{position:absolute;left:0;right:0;bottom:0;height:64px;display:flex;align-items:center;padding:0 40px;gap:16px;border-top:1px solid var(--line);color:var(--muted);font-size:17px}
  #words{display:flex;gap:10px;flex-wrap:wrap}
  .word{background:var(--panel2);border:1px solid var(--line);color:var(--ink);padding:4px 12px;border-radius:6px;font-size:18px}
  .word i{color:var(--accent2);font-style:normal}
  #nav{margin-left:auto;display:flex;gap:10px}
  .btn{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 16px;font-size:18px;cursor:pointer;font-family:var(--sans)}
  .btn:hover{border-color:var(--accent)}
  .btn.primary{background:var(--accent);color:#06121f;border-color:var(--accent);font-weight:700}

  h1{font-size:60px;margin:0 0 18px;line-height:1.1;letter-spacing:-.5px}
  h2{font-size:44px;margin:0 0 20px;line-height:1.15}
  .kicker{font-family:var(--mono);color:var(--accent);font-size:22px;letter-spacing:2px;text-transform:uppercase;margin-bottom:10px}
  p,li{font-size:30px;line-height:1.4}
  .muted{color:var(--muted)}
  .big{font-size:40px}
  .hl{color:var(--accent2);font-weight:700}
  .ok{color:var(--accent);font-weight:700}
  .bad{color:var(--warn);font-weight:700}
  .row{display:flex;gap:40px;align-items:flex-start}
  .col{flex:1}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:26px 30px}
  .rev{opacity:0;transform:translateY(10px);transition:opacity .35s, transform .35s;pointer-events:none}
  .rev.show{opacity:1;transform:none;pointer-events:auto}
  .rev.dim{opacity:.45}

  /* ticket */
  .ticket{background:var(--panel);border:1px solid var(--line);border-left:8px solid var(--accent2);border-radius:14px;padding:26px 34px;max-width:1300px}
  .ticket .hd{font-family:var(--mono);font-size:22px;color:var(--accent2);display:flex;gap:18px;margin-bottom:10px}
  .ticket .hd span.st{margin-left:auto;color:#06121f;background:var(--accent2);padding:2px 10px;border-radius:6px;font-weight:700}
  .ticket h3{font-size:38px;margin:0 0 12px}
  .ticket p{margin:8px 0;font-size:31px}

  /* warm-up list */
  .qa{display:flex;flex-direction:column;gap:14px}
  .q{display:flex;align-items:center;gap:22px;font-size:34px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 24px}
  .q .n{font-family:var(--mono);color:var(--accent);font-size:26px;width:34px}
  .q .a{margin-left:auto;color:var(--accent2);font-weight:700;font-family:var(--mono)}

  /* phases (stap 5) */
  .phases{display:flex;gap:12px;margin-bottom:14px}
  .ph{flex:1;border:2px solid var(--line);border-radius:14px;padding:10px 18px;color:var(--muted);font-size:24px;font-weight:700;display:flex;gap:12px;align-items:center}
  .ph b{font-family:var(--mono);font-size:28px}
  .ph.on{border-color:var(--accent);color:var(--ink);background:rgba(62,224,176,.08)}
  .ph.done{border-color:#3b5482;color:var(--ink)}
  .ph small{font-weight:400;font-size:18px;color:var(--muted);display:block}
  .think{display:flex;flex-direction:column;gap:8px}
  .line{display:flex;gap:16px;align-items:flex-start;font-size:27px;line-height:1.3}
  .line .tag{font-family:var(--mono);font-size:17px;padding:3px 9px;border-radius:6px;white-space:nowrap;margin-top:3px}
  .tag.tq{background:rgba(255,207,74,.15);color:var(--accent2);border:1px solid rgba(255,207,74,.4)}
  .tag.td{background:rgba(90,169,255,.15);color:var(--blue);border:1px solid rgba(90,169,255,.4)}
  .tag.r{background:rgba(62,224,176,.15);color:var(--accent);border:1px solid rgba(62,224,176,.4)}
  .calc{white-space:nowrap;font-family:var(--mono);color:var(--ink);background:#0b1220;border:1px solid var(--line);border-radius:8px;padding:2px 10px}
  .answer{font-size:31px;border:2px solid var(--accent);background:rgba(62,224,176,.08);border-radius:14px;padding:14px 22px;margin-top:6px}
  .est{display:flex;gap:12px;align-items:center;font-size:24px;color:var(--muted)}
  .est input{font-size:26px;font-family:var(--mono);background:#0b1220;color:var(--accent2);border:1px solid var(--line);border-radius:8px;padding:6px 12px;width:520px}

  /* start screen */
  #start h1{font-size:72px}
  .classes{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:26px}
  .cls{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px 26px;cursor:pointer;text-align:left;color:var(--ink);font-family:var(--sans)}
  .cls:hover{border-color:var(--accent);transform:translateY(-2px)}
  .cls .c{font-family:var(--mono);color:var(--accent);font-size:20px}
  .cls .t{font-size:30px;font-weight:700;margin:6px 0}
  .cls .s{font-size:20px;color:var(--muted)}
  .lesbtns{display:flex;gap:10px;margin-top:12px}
  .lesbtns .btn{font-size:18px}

  .help{position:absolute;right:60px;bottom:90px;font-size:18px;color:var(--muted);text-align:right;line-height:1.6}
  kbd{font-family:var(--mono);background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:1px 7px;color:var(--ink)}
  .timer{font-family:var(--mono);font-size:30px;color:var(--accent2);border:1px solid var(--line);border-radius:10px;padding:4px 14px;cursor:pointer;background:var(--panel)}
  .term{font-family:var(--mono);font-size:20px;color:var(--blue)}
  svg text{font-family:var(--sans)}
  .bgphoto{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.22;z-index:0;pointer-events:none}
  .bgphoto::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--bg) 0%,rgba(14,22,38,.4) 60%,rgba(14,22,38,.1) 100%)}
  #content > *{position:relative;z-index:1}
  #content > .bgphoto{position:absolute;z-index:0}
  .photo{display:block;object-fit:cover;border-radius:16px;border:1px solid var(--line);box-shadow:0 18px 40px rgba(0,0,0,.45);background:var(--panel)}
  .pz{border-radius:50%;overflow:hidden;box-shadow:0 16px 36px rgba(0,0,0,.55);background:#d99a3e;flex:none}
  .pz img{width:100%;height:100%;object-fit:cover;transform:scale(1.08);display:block}
  .flow{display:flex;align-items:stretch;gap:8px}
  .fs{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 20px;display:flex;flex-direction:column;gap:4px}
  .fs b{font-family:var(--mono);color:var(--accent);font-size:24px}
  .fs span{font-size:31px;font-weight:700;line-height:1.2}
  .fs small{font-size:23px;color:var(--muted);line-height:1.35}
  .fs small span{font-size:23px}
  .fs.choice{border-color:var(--accent2);flex:1.25}
  .fs.auto{border-style:dashed}
  .fa{align-self:center;color:var(--muted);font-size:34px}
  .credit{position:absolute !important;left:60px;bottom:4px;font-size:13px;color:#6f819f;z-index:2}
  .credit a{color:#6f819f}
</style>
</head>
<body>
<div id="viewport"><div id="stage">
  <div id="top">
    <div id="classTag" title="Andere klas kiezen (Home)">kies een klas</div>
    <div id="title" style="font-size:20px;color:var(--muted);white-space:nowrap">Rekenen · Oppervlakte</div>
    <div id="steps"></div>
  </div>
  <div id="content"></div>
  <div id="bottom">
    <div id="words"></div>
    <div id="nav">
      <button class="btn" id="homeBtn" title="Terug naar klaskeuze (Home)">⌂ klassen</button>
      <button class="btn" id="restartBtn" title="Deze les opnieuw vanaf het begin (R)">↺ opnieuw</button>
      <button class="btn" id="fsBtn" title="Volledig scherm (F)">⛶</button>
      <button class="btn" id="prevBtn">← terug</button>
      <button class="btn primary" id="nextBtn">verder →</button>
    </div>
  </div>
</div></div>

<script>
/* ============ helpers ============ */
const STEPS = ["Deur","Opwarmen","Uitleg","ICT-koppeling","Samen oplossen","Aan de slag"];
const $ = s => document.querySelector(s);
const R = (html, cls="", style="") => `<div class="rev ${cls}" style="${style}">${html}</div>`; // revealable block
const Q = (n, q, a) => R(`<div class="q"><span class="n">${n}</span><span>${q}</span><span class="a rev">${a}</span></div>`);
// think line: tag d = docent denkt/zegt, q = vraag aan klas, r = resultaat
const L = (tag, txt) => {
  const lab = {d:"ik denk", q:"vraag"}[tag];
  return R(`<div class="line"><span class="tag t${tag}">${lab}</span><span>${txt}</span></div>`);
};
const C = t => `<span class="calc">${t}</span>`;
const PH = (k) => `<!--phase:${k}-->`;
const TIMER = `<span class="timer" data-timer="10">⏱ 10 s</span>`;

/* ============ foto's (Wikimedia Commons, vrij te gebruiken) ============ */
const WM = "https://upload.wikimedia.org/wikipedia/commons/thumb/";
const PHOTOS = {
  pizza:   {src:WM+"c/c6/Pizza_Margherita_%28%29.JPG/1280px-Pizza_Margherita_%28%29.JPG", by:"Lombroso", lic:"CC BY-SA 4.0", page:"https://commons.wikimedia.org/wiki/File:Pizza_Margherita_().JPG"},
  lan:     {src:WM+"f/f7/Winter_2004_DreamHack_LAN_Party.jpg/1280px-Winter_2004_DreamHack_LAN_Party.jpg", by:"Toffelginkgo", lic:"CC BY-SA 3.0", page:"https://commons.wikimedia.org/wiki/File:Winter_2004_DreamHack_LAN_Party.jpg"},
  monitors:{src:WM+"2/27/Dual_monitor_setup_in_a_gaming_room_with_keyboard_and_mouse_in_focus.jpg/1280px-Dual_monitor_setup_in_a_gaming_room_with_keyboard_and_mouse_in_focus.jpg", by:"Shixart1985", lic:"CC BY 2.0", page:"https://commons.wikimedia.org/wiki/File:Dual_monitor_setup_in_a_gaming_room_with_keyboard_and_mouse_in_focus.jpg"},
  office:  {src:WM+"f/ff/Lone_office_worker_%28Unsplash%29.jpg/1280px-Lone_office_worker_%28Unsplash%29.jpg", by:"Jadon Barnes", lic:"CC0", page:"https://commons.wikimedia.org/wiki/File:Lone_office_worker_(Unsplash).jpg"},
  field:   {src:WM+"2/29/Aerial_view_of_the_Chatham_Town_FC_football_pitch.jpg/1280px-Aerial_view_of_the_Chatham_Town_FC_football_pitch.jpg", by:"Stephen Kennard", lic:"CC BY-SA 3.0", page:"https://commons.wikimedia.org/wiki/File:Aerial_view_of_the_Chatham_Town_FC_football_pitch.jpg"},
  dc:      {src:WM+"0/0c/Google_Data_Center%2C_Council_Bluffs_Iowa_%2849062863796%29.jpg/1280px-Google_Data_Center%2C_Council_Bluffs_Iowa_%2849062863796%29.jpg", by:"Chad Davis", lic:"CC BY 2.0", page:"https://commons.wikimedia.org/wiki/File:Google_Data_Center,_Council_Bluffs_Iowa_(49062863796).jpg"},
  lab:     {src:WM+"4/40/Computer_lab_showing_desktop_PCs_warwick.jpg/1280px-Computer_lab_showing_desktop_PCs_warwick.jpg", by:"Mike1024", lic:"publiek domein", page:"https://commons.wikimedia.org/wiki/File:Computer_lab_showing_desktop_PCs_warwick.jpg"},
  cafe:    {src:WM+"8/8d/Cafeteria_2.jpg/1280px-Cafeteria_2.jpg", by:"Tejeshmavinamar", lic:"CC BY-SA 4.0", page:"https://commons.wikimedia.org/wiki/File:Cafeteria_2.jpg"},
  ap:      {src:WM+"f/f8/Unifi_AC_Lite_Access_Point.jpg/1280px-Unifi_AC_Lite_Access_Point.jpg", by:"ServerGuruBrisbane", lic:"CC BY-SA 4.0", page:"https://commons.wikimedia.org/wiki/File:Unifi_AC_Lite_Access_Point.jpg"},
  code:    {src:WM+"7/7f/Code_on_computer_monitor_%28Unsplash%29.jpg/1280px-Code_on_computer_monitor_%28Unsplash%29.jpg", by:"Markus Spiske", lic:"CC0", page:"https://commons.wikimedia.org/wiki/File:Code_on_computer_monitor_(Unsplash).jpg"}
};
// foto als blok; verdwijnt netjes als er geen internet is
const PH_IMG = (k, w, h, extra="") => `<img class="photo" src="${PHOTOS[k].src}" alt="" style="width:${w}px;height:${h}px;${extra}" onerror="this.style.display='none'">`;
const BG = k => `<div class="bgphoto" style="background-image:url('${PHOTOS[k].src}')"></div>`;
const CREDIT = (...ks) => `<div class="credit">Foto's via Wikimedia Commons: ${ks.map(k=>`<a href="${PHOTOS[k].page}" target="_blank" rel="noopener">${PHOTOS[k].by}</a> (${PHOTOS[k].lic})`).join(" · ")}</div>`;
const PIZZA = (d) => `<div class="pz" style="width:${d}px;height:${d}px"><img src="${PHOTOS.pizza.src}" alt="" onerror="this.style.display='none'"></div>`;

function phases(){
  return `<div class="phases">
    <div class="ph" data-ph="1"><b>1</b><span>Analyseren<small>Wat is het probleem? Wat weet ik al?</small></span></div>
    <div class="ph" data-ph="2"><b>2</b><span>Uitvoeren<small>Wat reken ik eerst uit?</small></span></div>
    <div class="ph" data-ph="3"><b>3</b><span>Testen<small>Klopt mijn antwoord?</small></span></div>
  </div>`;
}
function estimateBox(){
  return R(`<div class="est">Schattingen van de klas: <input type="text" placeholder="typ hier de schattingen…" autocomplete="off"></div>`);
}

/* ============ SVG drawings ============ */
function gridRoom(x,y,w,h,cell,label,fill){
  let s=`<rect x="${x}" y="${y}" width="${w*cell}" height="${h*cell}" fill="${fill}" stroke="#eef3fb" stroke-width="3"/>`;
  for(let i=1;i<w;i++) s+=`<line x1="${x+i*cell}" y1="${y}" x2="${x+i*cell}" y2="${y+h*cell}" stroke="rgba(255,255,255,.18)"/>`;
  for(let j=1;j<h;j++) s+=`<line x1="${x}" y1="${y+j*cell}" x2="${x+w*cell}" y2="${y+j*cell}" stroke="rgba(255,255,255,.18)"/>`;
  s+=`<text x="${x+w*cell/2}" y="${y-18}" fill="#ffcf4a" font-size="34" font-weight="700" text-anchor="middle">${label}</text>`;
  s+=`<text x="${x+w*cell/2}" y="${y+h*cell+40}" fill="#9fb0cc" font-size="28" text-anchor="middle">${w} m</text>`;
  s+=`<text x="${x-18}" y="${y+h*cell/2+10}" fill="#9fb0cc" font-size="28" text-anchor="end">${h} m</text>`;
  return s;
}
const SVG_ROOMS = `<svg viewBox="0 0 900 420" width="900" height="420">
  ${gridRoom(110,60,6,4,55,"Kamer A","rgba(90,169,255,.25)")}
  ${gridRoom(560,60,5,5,55,"Kamer B","rgba(62,224,176,.22)")}
</svg>`;

const SVG_PIZZA = `<svg viewBox="0 0 900 360" width="900" height="360">
  <g><circle cx="200" cy="180" r="140" fill="#f2b03c" stroke="#c9771f" stroke-width="10"/>
  <circle cx="200" cy="180" r="118" fill="#e0542e" opacity=".55"/>
  <text x="200" y="352" fill="#eef3fb" font-size="30" text-anchor="middle" font-weight="700">1 × 40 cm</text></g>
  <g><circle cx="560" cy="180" r="98" fill="#f2b03c" stroke="#c9771f" stroke-width="8"/>
  <circle cx="560" cy="180" r="82" fill="#e0542e" opacity=".55"/>
  <circle cx="780" cy="180" r="98" fill="#f2b03c" stroke="#c9771f" stroke-width="8"/>
  <circle cx="780" cy="180" r="82" fill="#e0542e" opacity=".55"/>
  <text x="670" y="352" fill="#eef3fb" font-size="30" text-anchor="middle" font-weight="700">2 × 28 cm</text></g>
</svg>`;

function monitor(x,y,w,h,label){
  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="8" fill="#0b1220" stroke="#5aa9ff" stroke-width="6"/>
  <rect x="${x+w/2-14}" y="${y+h}" width="28" height="40" fill="#2c3f63"/>
  <rect x="${x+w/2-70}" y="${y+h+40}" width="140" height="10" rx="5" fill="#2c3f63"/>
  <text x="${x+w/2}" y="${y+h/2+16}" fill="#eef3fb" font-size="46" font-weight="700" text-anchor="middle">${label}</text>`;
}
// 24" 16:9 = 20.9 × 11.8 inch, 27" = 23.5 × 13.2 inch; schaal 15 px/inch
const SVG_MONITORS = `<svg viewBox="0 0 900 330" width="900" height="330">
  ${monitor(40,40,314,177,'24"')}${monitor(450,19,353,198,'27"')}
</svg>`;

// kantine 20 x 15 m, schaal 20 px/m
function apSvg(two){
  const ox=60, oy=30, s=20;
  let c = two
    ? `<circle cx="${ox+5*s}" cy="${oy+7.5*s}" r="${10*s}" fill="rgba(62,224,176,.18)" stroke="#3ee0b0" stroke-width="3"/>
       <circle cx="${ox+15*s}" cy="${oy+7.5*s}" r="${10*s}" fill="rgba(62,224,176,.18)" stroke="#3ee0b0" stroke-width="3"/>
       <circle cx="${ox+5*s}" cy="${oy+7.5*s}" r="9" fill="#ffcf4a"/><circle cx="${ox+15*s}" cy="${oy+7.5*s}" r="9" fill="#ffcf4a"/>
       <line x1="${ox+10*s}" y1="${oy}" x2="${ox+10*s}" y2="${oy+15*s}" stroke="#9fb0cc" stroke-dasharray="8 6"/>`
    : `<circle cx="${ox+10*s}" cy="${oy+7.5*s}" r="${10*s}" fill="rgba(62,224,176,.18)" stroke="#3ee0b0" stroke-width="3"/>
       <circle cx="${ox+10*s}" cy="${oy+7.5*s}" r="9" fill="#ffcf4a"/>
       <line x1="${ox+10*s}" y1="${oy+7.5*s}" x2="${ox+20*s}" y2="${oy+7.5*s}" stroke="#ffcf4a" stroke-width="3"/>
       <text x="${ox+15*s}" y="${oy+7.5*s-10}" fill="#ffcf4a" font-size="24" text-anchor="middle">r = 10 m</text>`;
  const corners = two ? "" : [[0,0],[20,0],[0,15],[20,15]].map(([a,b])=>`<circle cx="${ox+a*s}" cy="${oy+b*s}" r="20" fill="none" stroke="#ff6b6b" stroke-width="5"/>`).join("");
  return `<svg viewBox="0 0 520 380" width="520" height="380">
    <defs><clipPath id="room${two?2:1}"><rect x="${ox}" y="${oy}" width="${20*s}" height="${15*s}"/></clipPath></defs>
    <rect x="${ox}" y="${oy}" width="${20*s}" height="${15*s}" fill="rgba(255,107,107,.18)" stroke="#eef3fb" stroke-width="3"/>
    <g clip-path="url(#room${two?2:1})">${c}</g>${corners}
    <text x="${ox+10*s}" y="${oy+15*s+36}" fill="#9fb0cc" font-size="24" text-anchor="middle">20 m</text>
    <text x="${ox-12}" y="${oy+7.5*s+8}" fill="#9fb0cc" font-size="24" text-anchor="end">15 m</text>
  </svg>`;
}

const SVG_AVATAR = `<svg viewBox="0 0 420 380" width="420" height="380">
  <defs><pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="12" height="12" fill="rgba(255,107,107,.15)"/><line x1="0" y1="0" x2="0" y2="12" stroke="#ff6b6b" stroke-width="4"/></pattern></defs>
  <rect x="60" y="20" width="300" height="300" fill="url(#hatch)" stroke="#eef3fb" stroke-width="3"/>
  <circle cx="210" cy="170" r="150" fill="#16223a" stroke="#3ee0b0" stroke-width="4"/>
  <circle cx="210" cy="140" r="48" fill="#5aa9ff" opacity=".7"/>
  <path d="M120 285 Q210 180 300 285 Z" fill="#5aa9ff" opacity=".7"/>

        ${PH(1)}${L("q","Wat is hier de straal?")}
        ${L("d","De cirkel past precies: diameter = 400 px → <b>straal = 200 px</b>.")}
        ${L("q","Wat schatten jullie: welk deel valt weg?")}
        ${estimateBox()}
        ${PH(2)}${L("d",`Vierkant: ${C("400 × 400 = 160.000 px")}`)}
        ${L("d",`Cirkel: ${C("3,14 × 200 × 200 = 125.600 px")}`)}
        ${L("d",`Weg: ${C("160.000 − 125.600 = 34.400 px")}`)}
        ${L("d",`Deel: ${C("34.400 : 160.000 = 0,215")} → 21,5%`)}
        ${PH(3)}${L("q","Klopt dit met de schatting? En wat als je 400 als straal neemt?")}
        ${L("d",`${C("3,14 × 400 × 400 = 502.400 px")} → <span class="bad">groter dan de foto!</span>`)}
        ${R(`<div class="answer">✔ <b>34.400 px</b> weg ≈ <b>21,5%</b>, ongeveer een vijfde van de foto</div>`)}
      </div></div><div>${SVG_AVATAR.replace("r = ?","r = 200")}</div></div>`},
    {step:5, html: COMMON_FF(4,"Oppervlakte",["Omtrek en oppervlakte","Oppervlakte driehoeken","Oppervlakte cirkel"],
      "<b>Straal of diameter?</b><br>En test je antwoord: kán het eigenlijk wel?")}
  ]
}
};

/* ============ start screen ============ */
const START_HTML = `<div id="start">
  <div class="kicker">Rekenen · Oriëntatie in de twee- en driedimensionale wereld</div>
  <h1>Oppervlakte</h1>
  <p class="muted" style="margin:0">Kies de klas. De opgaven passen zich aan de opleiding aan.</p>
  <div class="classes">
    <div class="cls" style="cursor:default"><div class="c">25999 · niveau 2 · 2F</div><div class="t">Medewerker ICT</div><div class="s">ID.26MI.A · Oppervlakte 1</div>
      <div class="lesbtns"><button class="btn primary" data-go="mi-1">Les 1 · m²</button><button class="btn" data-go="mi-2">Les 2 · ha en km²</button></div></div>
    <button class="cls" data-go="st"><div class="c">27015 · niveau 3 · 2F</div><div class="t">ICT support technician</div><div class="s">ID.26ST.A · Oppervlakte 2</div></button>
    <button class="cls" data-go="se"><div class="c">27016 · niveau 4 · 3F</div><div class="t">ICT system engineer</div><div class="s">ID.26SE.A · cloud · cyber · network</div></button>
    <button class="cls" data-go="sd"><div class="c">25998 · niveau 4 · 3F</div><div class="t">Software developer</div><div class="s">ID.26SD.A · software · full stack · game</div></button>
    <button class="cls" data-go="sd" data-en="1"><div class="c">25998 · niveau 4 · 3F · TTO</div><div class="t">Software developer (EN)</div><div class="s">ID.26SD.E · met Engelse vaktermen</div></button>
  </div>
  <button class="btn" id="resetAll" style="position:absolute;left:60px;bottom:90px">↺ alles resetten</button>
  <div class="help">
    <kbd>→</kbd> / <kbd>spatie</kbd> / klik: volgende stap &nbsp; <kbd>←</kbd>: terug<br>
    <kbd>F</kbd>: volledig scherm &nbsp; <kbd>T</kbd>: timer &nbsp; <kbd>R</kbd>: les opnieuw &nbsp; <kbd>Home</kbd>: klas kiezen
  </div>
</div>`;

/* ============ engine ============ */
let lesson=null, slideIdx=0, revIdx=0, en=false;

function fit(){
  const s=Math.min(innerWidth/1600, innerHeight/900);
  $("#stage").style.transform=`scale(${s})`;
}
addEventListener("resize",fit); fit();

function renderSteps(active){
  $("#steps").innerHTML = STEPS.map((s,i)=>{
    const c = active<0 ? "" : (i===active?"on":(i<active?"done":""));
    return `<span class="stp ${c}">${i+1}. ${s}</span>`;
  }).join("");
}
function renderWords(){
  if(!lesson){ $("#words").innerHTML=""; return; }
  let w = lesson.words.map(t=>`<span class="word">${t}</span>`).join("");
  if(en && lesson.wordsEN) w += lesson.wordsEN.map(t=>`<span class="word term">${t}</span>`).join("");
  $("#words").innerHTML = w;
}

function showStart(){
  lesson=null; slideIdx=0; revIdx=0;
  $("#classTag").textContent="kies een klas";
  renderSteps(-1); renderWords();
  $("#content").innerHTML = START_HTML;
  document.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",e=>{
    e.stopPropagation(); en = b.dataset.en==="1"; startLesson(b.dataset.go);
  }));
  $("#resetAll").addEventListener("click",e=>{ e.stopPropagation(); resetAll(); });
  $("#homeBtn").style.display="none"; $("#restartBtn").style.display="none";
  $("#nextBtn").textContent="verder →";
  try{ if(location.hash) history.replaceState(null,"",location.pathname+location.search); }catch(e){}
}
function resetAll(){
  clearInterval(tInt); en=false; lesson=null;
  try{ location.replace(location.pathname); }catch(e){ showStart(); }
}
function restartLesson(){
  if(!lesson) return; clearInterval(tInt);
  slideIdx=0; revIdx=0; renderSlide();
}

function startLesson(key){
  lesson = LESSONS[key]; lesson.key=key; slideIdx=0; revIdx=0;
  $("#classTag").textContent = lesson.code + (en?" · TTO":"");
  $("#homeBtn").style.display=""; $("#restartBtn").style.display="";
  renderWords(); renderSlide();
  try{ location.hash = key + (en?"-en":""); }catch(e){}
}


function renderSlide(){
  const s = lesson.slides[slideIdx];
  renderSteps(s.step);
  // phase markers: wrap think lines with data-phase
  let html = s.html;
  $("#content").innerHTML = html;
  // tag rev elements in phased slides with their phase
  if(s.phased){
    let ph=0;
    const walker = document.createTreeWalker($("#content"), NodeFilter.SHOW_COMMENT|NodeFilter.SHOW_ELEMENT);
    let n; while((n=walker.nextNode())){
      if(n.nodeType===8){ const m=n.nodeValue.match(/phase:(\d)/); if(m) ph=+m[1]; }
      else if(n.classList && n.classList.contains("rev")) n.dataset.phase = n.dataset.phase || ph;
    }
  }
  revIdx=0; applyReveal();
  bindTimers();
}
function revList(){
  // ordered reveal list: top-level .rev plus answers inside .q (answer after question)
  const out=[];
  $("#content").querySelectorAll(".rev").forEach(el=>out.push(el));
  return out;
}
function applyReveal(){
  const list=revList();
  list.forEach((el,i)=>el.classList.toggle("show", i<revIdx));
  // phases highlight
  const s=lesson.slides[slideIdx];
  if(s.phased){
    let cur=0; list.forEach((el,i)=>{ if(i<revIdx) cur=Math.max(cur,+el.dataset.phase||0); });
    document.querySelectorAll(".ph").forEach(p=>{
      const k=+p.dataset.ph; p.classList.toggle("on",k===cur); p.classList.toggle("done",k<cur);
    });
  }
  const last = slideIdx===lesson.slides.length-1 && revIdx>=list.length;
  $("#nextBtn").textContent = last ? "klaar ✓ → klassen" : "verder →";
}
function next(){
  if(!lesson) return;
  const list=revList();
  if(revIdx<list.length){ revIdx++; applyReveal();
    const el=list[revIdx-1]; const inp=el.querySelector && el.querySelector("input"); if(inp) setTimeout(()=>inp.focus(),50);
    return; }
  if(slideIdx<lesson.slides.length-1){ slideIdx++; renderSlide(); }
  else showStart();
}
function prev(){
  if(!lesson) return;
  if(revIdx>0){ revIdx--; applyReveal(); return; }
  if(slideIdx>0){ slideIdx--; renderSlide(); revIdx=revList().length; applyReveal(); }
  else showStart();
}

/* timer */
let tInt=null;
function bindTimers(){
  document.querySelectorAll("[data-timer]").forEach(t=>t.addEventListener("click",e=>{e.stopPropagation();runTimer(t);}));
}
function runTimer(t){
  t = t || document.querySelector("[data-timer]"); if(!t) return;
  clearInterval(tInt); let left=+t.dataset.timer; t.textContent=`⏱ ${left} s`; t.style.color="var(--accent2)";
  tInt=setInterval(()=>{ left--; t.textContent = left>0?`⏱ ${left} s`:"⏱ tijd!"; if(left<=0){clearInterval(tInt); t.style.color="var(--warn)";} },1000);
}

/* fullscreen */
function toggleFS(){
  try{
    if(!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
    else document.exitFullscreen().catch(()=>{});
  }catch(e){}
}

/* input */
document.addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT"){ if(e.key==="Escape"||e.key==="Enter") e.target.blur(); return; }
  if(["ArrowRight","PageDown"," ","Enter"].includes(e.key)){ e.preventDefault(); next(); }
  else if(["ArrowLeft","PageUp","Backspace"].includes(e.key)){ e.preventDefault(); prev(); }
  else if(e.key==="Home"||e.key==="Escape"&&!document.fullscreenElement){ showStart(); }
  else if(e.key==="f"||e.key==="F"){ toggleFS(); }
  else if(e.key==="t"||e.key==="T"){ runTimer(); }
  else if(e.key==="r"||e.key==="R"){ restartLesson(); }
});
$("#content").addEventListener("click",e=>{
  if(e.target.closest("input,button,.btn,[data-timer],.cls")) return;
  next();
});
$("#nextBtn").addEventListener("click",next);
$("#prevBtn").addEventListener("click",prev);
$("#fsBtn").addEventListener("click",toggleFS);
$("#classTag").addEventListener("click",showStart);
$("#homeBtn").addEventListener("click",showStart);
$("#restartBtn").addEventListener("click",restartLesson);

/* deep link via #mi-1, #st, #se, #sd, #sd-en */
function fromHash(){
  const h=(location.hash||"").slice(1);
  if(!h){ showStart(); return; }
  const isEn = h.endsWith("-en"); const key = isEn? h.slice(0,-3) : h;
  if(LESSONS[key]){ en=isEn; if(!lesson||lesson.key!==key){ startLesson(key);} }
  else showStart();
}
addEventListener("hashchange", fromHash);
fromHash();
</script>
</body>
